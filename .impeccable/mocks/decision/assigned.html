<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;font-family:Helvetica,Arial,sans-serif;background:#b3122a;color:#f7f5f0;display:grid;grid-template-columns:420px 1fr;overflow:hidden}
.strip{background:#f7f5f0;margin:40px 0 0 80px;padding:18px 18px 40px;transform:rotate(-2deg);display:flex;flex-direction:column;gap:12px;width:300px;height:900px;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.f{flex:0 0 190px;background:linear-gradient(135deg,#444,#111);filter:grayscale(1)}
nav{display:flex;gap:32px;padding:32px 80px 0 0;justify-content:flex-end;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:120px;line-height:.9;font-weight:900;letter-spacing:-.04em;margin:70px 0 0;text-transform:uppercase}
.panel{margin-top:48px;background:#1a1a1a;border:6px solid #b9bcc0;border-radius:18px;padding:28px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:820px}
.s{background:#2a2a2a;border-radius:10px;padding:14px;text-align:center}.s b{display:block;font-size:56px;color:#ffd400;font-variant-numeric:tabular-nums}.s span{font-size:14px}
.cta{grid-column:span 5;background:#ffd400;color:#111;text-align:center;padding:18px;border-radius:999px;font-weight:800;font-size:20px;text-transform:uppercase}
</style></head><body><div class="strip"><div class="f"></div><div class="f"></div><div class="f"></div><div class="f"></div></div>
<div><nav><span>Le bar</span><span>Boutique</span><span>Résidents</span><span>Ateliers</span><span>Panier 0</span></nav>
<h1>4 poses,<br>6 teckels,<br>1 café.</h1>
<div class="panel"><div class="s"><span>10 h</span><b>16</b><span>places</span></div><div class="s"><span>12 h</span><b>09</b><span>places</span></div><div class="s"><span>14 h</span><b>03</b><span>places</span></div><div class="s"><span>16 h</span><b>12</b><span>places</span></div><div class="s"><span>18 h</span><b>00</b><span>complet</span></div><div class="cta">Réserver samedi 24 →</div></div></div></body></html>
